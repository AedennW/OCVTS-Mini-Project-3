      <ellipse cx="0" cy="-12" rx="7" ry="26"/>
      <path d="M0 -38 V14"/>
      <rect x="-5" y="14" width="10" height="28" rx="5"/>
    </g>
  </defs>

  <rect width="560" height="420" fill="#17120f"/>

  <!-- Row 1 -->
