    <circle cx="280" cy="105" r="3"/>
    <circle cx="420" cy="105" r="3"/>
    <circle cx="70" cy="315" r="3"/>
    <circle cx="210" cy="315" r="3"/>
    <circle cx="350" cy="315" r="3"/>
    <circle cx="490" cy="315" r="3"/>
    <circle cx="70" cy="0" r="3"/>
