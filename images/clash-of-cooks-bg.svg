  <use href="#knives" x="210" y="105"/>
  <use href="#flame" x="350" y="105"/>
  <use href="#whisk" x="490" y="105"/>

  <!-- Row 2 (offset; wrap-around copy at x=0 / x=560 for seamless sides) -->
