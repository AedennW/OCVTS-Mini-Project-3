      </g>
    </g>
    <g id="hat" fill="none" stroke="#5a4130" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-22 22 L-22 2 C-42 2 -42 -30 -18 -28 C-14 -46 14 -46 18 -28 C42 -30 42 2 22 2 L22 22 Z"/>
      <path d="M-22 12 H22"/>
    </g>
    <g id="flame" fill="none" stroke="#9a4a1f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 -38 C10 -20 24 -12 24 8 C24 24 12 34 0 34 C-12 34 -24 24 -24 8 C-24 -4 -16 -8 -12 -18 C-6 -10 -2 -20 0 -38 Z"/>
      <path d="M0 6 C6 12 10 16 10 22 C10 28 5 31 0 31 C-5 31 -10 28 -10 22 C-10 16 -4 12 0 6 Z"/>
    </g>
