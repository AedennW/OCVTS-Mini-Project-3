    <circle cx="70" cy="210" r="3"/>
    <circle cx="210" cy="210" r="3"/>
    <circle cx="350" cy="210" r="3"/>
    <circle cx="490" cy="210" r="3"/>
    <circle cx="0" cy="105" r="3"/>
