<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <g id="knives" fill="none" stroke="#5a4130" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <g transform="rotate(40)">
